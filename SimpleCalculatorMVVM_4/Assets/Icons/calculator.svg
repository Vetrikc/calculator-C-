<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" fill="#0F0F0F" rx="50"/>

  <!-- Calculator display -->
  <rect x="30" y="30" width="196" height="80" fill="#1A1A1A" rx="10" stroke="#00E5FF" stroke-width="3"/>
  <text x="128" y="75" font-size="48" font-weight="bold" fill="#00E5FF" text-anchor="middle" font-family="Arial">42</text>

  <!-- Buttons grid representation -->
  <g fill="#333" stroke="#555" stroke-width="2">
	<!-- Row 1 -->
	<rect x="30" y="130" width="36" height="36" rx="18"/>
	<rect x="75" y="130" width="36" height="36" rx="18"/>
	<rect x="120" y="130" width="36" height="36" rx="18"/>
	<rect x="165" y="130" width="36" height="36" rx="18" fill="#FF6B35"/>

	<!-- Row 2 -->
	<rect x="30" y="175" width="36" height="36" rx="18"/>
	<rect x="75" y="175" width="36" height="36" rx="18"/>
	<rect x="120" y="175" width="36" height="36" rx="18"/>
	<rect x="165" y="175" width="36" height="36" rx="18" fill="#FF6B35"/>
  </g>
</svg>
